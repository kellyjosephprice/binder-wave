# binder-wave.tmux.conf — tmux status bar theme built from the binder-wave
# palette (dark-mode values; terminal themes don't switch with the system).
#
# Usage: source this file from your tmux.conf, e.g.
#   run-shell "tmux source-file /path/to/binder-wave.tmux.conf"
#
# Hex values inlined rather than defined as config-file variables: tmux's
# %hidden variable substitution and its #{...} runtime format expansion are
# two different mechanisms, easy to cross and have silently not expand.

set -g status-style "bg=#303030,fg=#e8e8e8"

set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#55aaec"

set -g message-style "bg=#c7b137,fg=#252525"
set -g message-command-style "bg=#c7b137,fg=#252525"

set -g status-left-length 32
set -g status-left "#[bg=#71c288,fg=#252525,bold] #S #[bg=#303030,fg=#e8e8e8] "

set -g status-right-length 64
set -g status-right "#[fg=#909090]%Y-%m-%d %H:%M #[bg=#55aaec,fg=#252525,bold] #h "

setw -g window-status-format "#[fg=#909090] #I:#W "
setw -g window-status-current-format "#[bg=#55aaec,fg=#252525,bold] #I:#W "

setw -g window-status-bell-style "fg=#ff5a88,bold"
