# binder-wave.conf — kitty terminal theme
#
# Dark-mode only (terminal themes don't switch with the system the way the
# CSS palette does). Uses the canonical Solarized 16-color ANSI mapping
# (ethanschoonover.com/solarized) with binder-wave's hex substituted for
# Solarized's originals — same convention most Solarized-derived terminal
# themes follow, so anything written against "Solarized's color slots"
# still lines up here.

background            #252525
foreground             #e8e8e8
cursor                 #e8e8e8
cursor_text_color      #252525

selection_background    #303030
selection_foreground    #e8e8e8

url_color               #55aaec

# black
color0  #303030
color8  #252525

# red
color1  #ff5a88
color9  #e5783f

# green
color2  #71c288
color10 #6a6a6a

# yellow
color3  #c7b137
color11 #777777

# blue
color4  #55aaec
color12 #909090

# magenta
color5  #e368c8
color13 #9b86f0

# cyan
color6  #51c1bf
color14 #9e9e9e

# white
color7  #e8e8e8
color15 #f7f7f7
